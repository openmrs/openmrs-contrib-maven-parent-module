# This IT only checks that the parent wires pgpverify into the build and that its
# verify goal executes; whether the resolved artifacts are correctly signed is the
# plugin's own concern. failOnMissingSignature is disabled so the build outcome does
# not depend on the current signing state of the platform artifacts this fixture
# pulls in -- the plugin still runs and inspects them, which is all this test asserts.
invoker.goals = clean verify
invoker.mavenOpts = -Dopenmrs.pgpverify.failOnMissingSignature=false
invoker.buildResult = success
