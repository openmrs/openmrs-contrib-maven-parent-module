version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.openmrs.api:*"
      - dependency-name: "org.openmrs.web:*"
      - dependency-name: "org.openmrs.test:*"
      - dependency-name: "org.openmrs.tools:*"
      # JDK-tiered: managed by the update-jdk-tiered-deps workflow, which respects per-JDK version caps
      - dependency-name: "com.diffplug.spotless:spotless-maven-plugin"
      - dependency-name: "com.mycila:license-maven-plugin"
    groups:
      maven-plugins:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
