name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (semver, e.g. 1.0.0)'
        required: true
        type: string
      developmentVersion:
        description: 'Next development version (e.g. 1.1.0); leave blank to let the release script derive it'
        required: false
        type: string
        default: ''
      skipTests:
        description: 'Skip tests during the release build'
        required: false
        type: boolean
        default: true

# Releases mutate the repository (version bumps, tag) and must not overlap.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      
    steps:
    - name: Generate release bot token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.OMRS_RELEASE_BOT_APP_ID }}
        private-key: ${{ secrets.OMRS_RELEASE_BOT_PRIVATE_KEY }}

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Full history is required so the release plugin can commit and tag.
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
        # Auth is handled via the insteadOf rewrite below so it also applies to
        # the SSH developerConnection the release plugin pushes through.
        persist-credentials: false

    - name: Resolve bot identity
      id: bot
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

    - name: Configure git
      env:
        BOT_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        BOT_USER_ID: ${{ steps.bot.outputs.user-id }}
      run: |
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        # The pom's developerConnection uses an SSH URL; rewrite it to an
        # authenticated HTTPS URL so the release plugin can push as the bot.
        git config --global url."https://x-access-token:${BOT_TOKEN}@github.com/".insteadOf "git@github.com:"

    - name: Setup JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.2
      with:
        distribution: 'zulu'
        cache: 'maven'
        java-version: '25'

    - name: Configure Maven settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <settings>
          <servers>
            <server>
              <id>openmrs-repo-releases</id>
              <username>${env.MAVEN_REPO_USERNAME}</username>
              <password>${env.MAVEN_REPO_API_KEY}</password>
            </server>
            <server>
              <id>openmrs-repo-snapshots</id>
              <username>${env.MAVEN_REPO_USERNAME}</username>
              <password>${env.MAVEN_REPO_API_KEY}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Checkout release scripts
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: openmrs/openmrs-contrib-bamboo
        path: release-scripts
        persist-credentials: false

    - name: Release
      env:
        MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
        MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}
        RELEASE_VERSION: ${{ inputs.releaseVersion }}
        DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        SKIP_TESTS: ${{ inputs.skipTests }}
      run: |
        export MAVEN_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")"
        args=(-e "git@github.com:${GITHUB_REPOSITORY}.git" -r "${RELEASE_VERSION}")
        if [[ -n "${DEVELOPMENT_VERSION}" ]]; then
          args+=(-d "${DEVELOPMENT_VERSION}")
        fi
        if [[ "${SKIP_TESTS}" == "true" ]]; then
          args+=(-s)
        fi
        bash release-scripts/release-prepare-perform.sh "${args[@]}"
